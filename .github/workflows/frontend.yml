name: Vehicle and companion
on:
  pull_request:
    paths: ['app/**', 'passenger-web/**', '*.gradle.kts', 'gradle.properties', 'gradlew', 'gradle/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  vehicle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: passenger-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: npm ci
      - run: npm test
